# Cloud Build → Artifact Registry → Cloud Run.
# gcloud run deploy --source 로도 되지만, 이 파일이 있으면 빌드 단계가
# 재현 가능하게 남는다 (심사 기준 "reproducible setup instructions").
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_IMAGE}
      - .
  - name: gcr.io/cloud-builders/docker
    args: [push, "${_IMAGE}"]
images:
  - ${_IMAGE}
substitutions:
  _IMAGE: us-central1-docker.pkg.dev/${PROJECT_ID}/yudonknow/app:latest
options:
  logging: CLOUD_LOGGING_ONLY
