<!doctype html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>yudonKnow — {{ L['landing.junior.cta'] }}</title>
{% include "_style.html" %}
</head>
<body>
<header>
  <a class="brand" href="/">yudon<span>Know</span></a>
  <div class="who">
    <span>{{ L['nav.me'] }}</span>
    <input type="text" id="asker" placeholder="{{ L['nav.id'] }}">
    <a href="?lang={{ other_lang }}">{{ L['lang.switch'] }}</a>
  </div>
</header>

<main class="wide">
  <div class="badges" style="margin-bottom:10px">
    <span class="b am" id="label"></span>
    <span class="b" id="days"></span>
  </div>
  <p class="quiet" style="margin-top:0">{{ L['alter.disclaimer'] }}</p>

  <div class="row" style="margin:16px 0 6px">
    <input type="text" id="q" placeholder="{{ L['alter.ask.ph'] }}" onkeydown="if(event.key==='Enter')ask()">
    <button class="primary" onclick="ask()">{{ L['alter.ask.cta'] }}</button>
  </div>
  <div class="err" id="err"></div>

  <div class="panes" style="grid-template-columns:1fr" id="out"></div>
</main>

<footer>v{{ version }} · {{ L['alter.footer'] }}</footer>

<script>
const EXPERT = {{ expert_id | tojson }};
const LANG = {{ lang | tojson }};
const L = {{ L | tojson }};
const qs = LANG === 'en' ? '' : ('?lang=' + LANG);
const $ = id => document.getElementById(id);
function esc(s){ return String(s??'').replace(/[&<>"]/g, c => (
  {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

async function api(path, opts){
  const sep = path.includes('?') ? '&' : '?';
  const url = LANG === 'en' ? path : path + sep + 'lang=' + LANG;
  const res = await fetch(url, Object.assign({headers:{'Content-Type':'application/json'}}, opts||{}));
  const body = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(body.error || body.detail || ('HTTP ' + res.status));
  return body;
}

(async function boot(){
  $('asker').value = localStorage.getItem('ydk_me') || '';
  $('label').textContent = L['alter.of'].replace('{}', EXPERT);
  try{
    const l = await api('/api/experts');
    const e = (l.experts||[]).find(x => x.id === EXPERT);
    if(e){
      $('label').textContent = e.alter;
      $('days').textContent = e.days_left === null ? L['home.staying']
        : (e.days_left >= 0 ? L['alter.dday'].replace('{}', e.days_left) : L['alter.gone']);
    }
  }catch(e){}
})();

async function ask(){
  const q = $('q').value.trim();
  if(!q) return;
  $('err').textContent = '';
  localStorage.setItem('ydk_me', $('asker').value.trim());
  try{
    const r = await api('/api/alter/'+encodeURIComponent(EXPERT)+'/ask', {method:'POST',
      body: JSON.stringify({question:q, asker: $('asker').value.trim()})});
    render(q, r);
    $('q').value = '';
  }catch(e){ $('err').textContent = e.message; }
}

function render(q, r){
  const wrap = document.createElement('div');
  wrap.className = 'card' + (r.is_gap ? ' alarm' : '');
  let html = `<p class="quiet">Q ${esc(q)}</p>`;

  if(r.is_gap){
    html += `<div class="gap">${esc(r.text).replace(/\n/g,'<br>')}</div>
      <p class="quiet">${esc(L['alter.gap.note'])}</p>`;
  } else {
    html += `<p class="t" style="font-size:16px">${esc(r.persona)}</p>
             <div class="c" style="color:var(--ink);font-size:14.5px">${esc(r.text).replace(/\n/g,'<br>')}</div>`;
    if(r.apprentice_notice)
      html += `<div class="gap" style="margin-top:10px">🔴 ${esc(r.apprentice_notice)}</div>`;
    if(r.contested.length)
      html += `<div class="gap" style="margin-top:10px">${esc(L['alter.contested'])}</div>`;

    html += `<h2 class="sec">${esc(L['alter.evidence'])}</h2>`;
    for(const c of r.cards){
      const tacit = c.tacitness==='hands' ? L['tacit.hands']
                  : c.tacitness==='partial' ? L['tacit.partial'] : L['tacit.speakable'];
      html += `<div class="card ${c.verified?'ok':''}" style="margin:0 0 10px">
        <div class="badges">
          ${c.verified ? `<span class="b ok">${esc(L['alter.verified'])}</span>`
                       : `<span class="b">${esc(L['alter.unverified'])}</span>`}
          <span class="b">${esc(c.domain||'—')}</span>
          <span class="b">${esc(tacit)}</span>
        </div>
        <p class="t">${esc(c.title)}</p>
        ${c.cues.length? `<p class="c"><b>${esc(L['alter.cues'])}</b><br>· ${c.cues.map(esc).join('<br>· ')}</p>`:''}
        ${c.action.length? `<p class="c"><b>${esc(L['alter.action'])}</b><br>${c.action.map(esc).join(' → ')}</p>`:''}
        ${c.exceptions.length? `<p class="c" style="color:var(--danger)"><b>${esc(L['alter.exceptions'])}</b><br>· ${c.exceptions.map(esc).join('<br>· ')}</p>`:''}
        ${c.failure? `<p class="c" style="color:var(--amber)"><b>${esc(L['alter.failure'])}</b><br>${esc(c.failure)}</p>`:''}
        ${c.unspeakable.length? `<p class="c">${esc(L['alter.unspeakable'])} ${c.unspeakable.map(esc).join(' / ')}</p>`:''}
        <div class="acts">
          <button class="primary" onclick="report('${c.id}','helped',this)">${esc(L['alter.report.ok'])}</button>
          <button onclick="report('${c.id}','missed',this)">${esc(L['alter.report.no'])}</button>
        </div>
      </div>`;
    }
    if(r.stubbed) html += `<p class="quiet">${esc(L['alter.stubbed'])}</p>`;
  }
  wrap.innerHTML = html;
  $('out').prepend(wrap);
}

async function report(cardId, verdict, btn){
  const detail = prompt(verdict === 'helped' ? L['alter.report.ok.q'] : L['alter.report.no.q']) || '';
  try{
    await api('/api/cards/'+cardId+'/report', {method:'POST', body: JSON.stringify({
      verdict, reporter: $('asker').value.trim(), detail })});
    btn.parentElement.innerHTML = '<span class="quiet">'
      + esc(verdict === 'helped' ? L['alter.report.ok.done'] : L['alter.report.no.done'])
      + '</span>';
  }catch(e){ $('err').textContent = e.message; }
}
</script>
</body>
</html>
